spring:
  application:
    name: clientes

  datasource:
    # Postgres local (14) da maquina. Sem env var: roda direto no STS.
    url: jdbc:postgresql://localhost:5432/crm_kauezao
    username: kauezao
    password: "***REMOVIDO***"
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  web:
    error:
      include-message: never

server:
  port: 8080
  shutdown: graceful

app:
  registration:
    enabled: true
  cors:
    origins: http://localhost:3000,http://localhost:5173

api:
  security:
    token:
      # Segredo so para uso local. Nao usar em producao.
      secret: elo-dev-secret-local-troque-em-producao
    time:
      expiration:
        token:
          # Validade do token em segundos (24h).
          secret: 86400

logging:
  level:
    com.CRM.clientes: INFO
