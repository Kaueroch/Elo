spring:
  application:
    name: clientes

  # Sobrescritas locais (senha do seu Postgres etc.). Arquivo fora do git.
  config:
    import: optional:classpath:application-local.yml

  datasource:
    # Valores padrao para dev. Em producao, defina as variaveis de ambiente.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm_kauezao}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  web:
    error:
      include-message: never

server:
  port: 8080
  shutdown: graceful

app:
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

api:
  security:
    token:
      # Padrao so para uso local. Em producao, defina TOKEN_SECRET.
      secret: ${TOKEN_SECRET:elo-dev-secret-local-troque-em-producao}
    time:
      expiration:
        token:
          # Validade do token em segundos (24h).
          secret: ${TOKEN_EXPIRATION_SECONDS:86400}

logging:
  level:
    com.CRM.clientes: INFO
