spring:
  application:
    name: clientes

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:crm_kauezao}
    username: ${DB_USER:kauezao}
    password: "${DB_PASSWORD}"
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    hibernate:
      # O create das tabelas clientes/usuarios/origens e garantido pelo schema SQL
      # na primeira subida do Postgres; o update cobre volumes de banco ja
      # criados antes da autenticacao existir (novas tabelas sao adicionadas).
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  web:
    error:
      include-message: never

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
app:
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
  cors:
    origins: ${CORS_ORIGINS}

api:
  security:
    token:
      # Troque em producao; o padrao so serve para desenvolvimento local.
      secret: ${TOKEN_SECRET}
    time:
      expiration:
        token:
          # Validade do token em segundos (24h).
          secret: ${TOKEN_EXPIRATION_SECONDS:86400}

logging:
  level:
    com.CRM.clientes: INFO