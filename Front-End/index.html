<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CRM Kauezao - gestao de clientes atendidos" />
    <title>CRM Kauezao</title>
    <script>
      // Aplica o tema antes da primeira pintura para evitar flash de tela.
      ;(function () {
        try {
          var salvo = localStorage.getItem('crm:tema')
          if (!salvo) {
            salvo = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', salvo)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
